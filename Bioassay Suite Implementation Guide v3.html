document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-family: var(--ff-mono);\n    font-size: 28px;\n    color: var(--c-accent);\n    font-weight: 500;\n    letter-spacing: 0;\n    vertical-align: 0.08em;\n    margin-left: 6px;\n  }\n  .doc-sub {\n    font-family: var(--ff-sans);\n    font-size: 13px;\n    color: var(--c-ink-3);\n    margin-top: 12px;\n  }\n\n  /* Headings */\n  h2 {\n    font-family: var(--ff-serif);\n    font-size: 26px;\n    line-height: 1.25;\n    font-weight: 600;\n    margin: 56px 0 14px;\n    letter-spacing: -0.005em;\n    color: var(--c-ink);\n    padding-bottom: 8px;\n    border-bottom: 1px solid var(--c-line);\n  }\n  h2 .sec {\n    font-family: var(--ff-mono);\n    font-size: 13px;\n    color: var(--c-accent);\n    font-weight: 500;\n    letter-spacing: 0.04em;\n    display: inline-block;\n    margin-right: 10px;\n    padding: 2px 8px;\n    background: var(--c-accent-soft);\n    border-radius: 4px;\n    vertical-align: 0.18em;\n  }\n  h3 {\n    font-family: var(--ff-serif);\n    font-size: 19px;\n    font-weight: 600;\n    margin: 32px 0 8px;\n    color: var(--c-ink);\n  }\n  h4 {\n    font-family: var(--ff-sans);\n    font-size: 13px;\n    font-weight: 600;\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n    color: var(--c-ink-3);\n    margin: 24px 0 8px;\n  }\n\n  p { margin: 0 0 14px; }\n  p, li { color: var(--c-ink-2); }\n\n  /* Inline */\n  code {\n    font-family: var(--ff-mono);\n    font-size: 0.88em;\n    background: var(--c-code-bg);\n    border: 1px solid var(--c-code-border);\n    padding: 1px 5px;\n    border-radius: 3px;\n    color: #4a3a1a;\n    white-space: nowrap;\n  }\n  strong { color: var(--c-ink); font-weight: 600; }\n  em { font-style: italic; }\n  a { color: var(--c-accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }\n\n  /* Lead callout (blockquote at top) */\n  .lead {\n    background: var(--c-info-bg);\n    border-left: 3px solid var(--c-accent);\n    padding: 18px 22px;\n    border-radius: 0 var(--r -ink); width: 30%; }\n  td.sec-ref { width: 60px; font-family: var(--ff-mono); font-size: 12px; color: var(--c-accent); white-space: nowrap; }\n\n  /* Acceptance checkboxes */\n  .check-list { list-style: none; padding-left: 0; font-family: var(--ff-sans); font-size: 14px; }\n  .check-list li {\n    position: relative;\n    padding: 4px 0 4px 28px;\n    color: var(--c-ink-2);\n  }\n  .check-list li::before {\n    content: \"\";\n    position: absolute;\n    left: 0; top: 9px;\n    width: 14px; height: 14px;\n    border: 1.5px solid var(--c-line-2);\n    border-radius: 3px;\n    background: var(--c-surface);\n  }\n\n  /* Section card around major fixes */\n  .fix-section {\n    /* nothing — kept clean; visual rhythm comes from h2/h3 */\n  }\n\n  /* Footer note */\n  hr {\n    border: 0;\n    border-top: 1px solid var(--c-line);\n    margin: 48px 0 24px;\n  }\n  .meta-footer {\n    font-family: var(--ff-sans);\n    font-size: 12px;\n    color: var(--c-ink-4);\n    font-style: italic;\n    text-align: center;\n    margin-top: 32px;\n  }\n\n  /* \"Drop-in\" / \"Replace verbatim\" call-to-action label */\n  .label {\n    display: inline-block;\n    font-family: var(--ff-mono);\n    font-size: 11px;\n    letter-spacing: 0.04em;\n    padding: 2px 8px;\n    border-radius: 4px;\n    background: var(--c-warn-bg);\n    color: var(--c-warn-ink);\n    border: 1px solid var(--c-warn-border);\n    margin-right: 6px;\n    vertical-align: 1px;\n  }\n\n  /* Print */\n  @media print {\n    body { background: white; font-size: 11pt; }\n    .page { max-width: none; padding: 0.6in; }\n    pre { font-size: 9pt; }\n    h2 { page-break-after: avoid; }\n    pre, table { page-break-inside: avoid; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<main class=\"page\">\n\n  <div class=\"doc-eyebrow\">Bioassay Suite · GUI Refresh<\u002Fdiv>\n  <h1>Implementation Guide<span class=\"v3\">v3<\u002Fspan><\u002Fh1>\n  <div class=\"doc-sub\">Surgical patch on top of v2 — five visual fixes only.<\u002Fdiv>\n\n  <div class=\"lead\">\n    <p><strong>Read this first.<\u002Fstrong> v2 was implemented and the markup landed correctly, but five visual elements still don't paint as designed. v3 is a <strong>surgical patch<\u002Fstrong> on top of v2 — it does <strong>not<\u002Fstrong> replace v2's spec or markup. Apply the fixes in this guide on top of the current <code>main<\u002Fcode> branch.<\u002Fp>\n    <p><strong>Ground rules (unchanged from v2):<\u002Fstrong><\u002Fp>\n    <ol style=\"margin: 6px 0 0 0; padding-left: 22px;\">\n      <li><strong>No business logic changes.<\u002Fstrong> Do not touch DRC fitting, outlier detection, tissue normalization, multi-wavelength concordance, auto-save, file-import logic, output-folder naming, or <code>runApp()<\u002Fcode> entry points.<\u002Fli>\n      <li><strong>All four plate matrices stay<\u002Fstrong> with their observers and reactives intact. Layer switching is visibility-only.<\u002Fli>\n      <li><strong>Bilingual i18n engine stays.<\u002Fstrong> Only <strong>add<\u002Fstrong> keys; never rename.<\u002Fli>\n      <li>If anything in this guide conflicts with existing logic, <strong>stop and ask<\u002Fstrong> — do not improvise.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n\n  <h2>What's still broken after v2<\u002Fh2>\n  <p>The five symptoms in Kristof's screenshots:<\u002Fp>\n\n  <table>\n    <thead>\n      <tr><th>#<\u002Fth><th>Symptom<\u002Fth><th>Root cause<\u002Fth><th>Fix<\u002Fth><\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr>\n        <td class=\"sym\">A<\u002Ftd>\n        <td>Top-bar wraps onto 3 lines: brand on row 1, \"Start Guided Tour / Docs\" on row 2, language <code>selectInput<\u002Fcode> on row 3.<\u002Ftd>\n        <td>Shiny wraps <code>selectInput<\u002Fcode> in <code>&lt;div class=\"form-group shiny-input-container\"&gt;<\u002Fcode> (block-level). <code>.bs-topbar { display: flex }<\u002Fcode> doesn't help when each child is a 100%-wide block. The CSS has no rule forcing those wrappers to lay out inline. The <code>actionButton<\u002Fcode> for \"Start Guided Tour\" also still reads as a default Bootstrap button (white pill with icon), not a quiet text button.<\u002Ftd>\n        <td class=\"sec-ref\">§ 1<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td class=\"sym\">B<\u002Ftd>\n        <td>Wizard step pills lost their <code>01 / 02 / 03 / 04 / 05<\u002Fcode> chips and the progress connector.<\u002Ftd>\n        <td>Two compounding issues: (1) the JS that stamps <code>data-step<\u002Fcode> runs once on <code>$(function(){})<\u002Fcode> but <code>tabsetPanel(type=\"pills\")<\u002Fcode> rebuilds its DOM after <code>shown.bs.tab<\u002Fcode> events on <strong>inner<\u002Fstrong> Shiny re-renders, dropping the attribute; (2) Bootstrap's <code>.nav-pills &gt; li &gt; a<\u002Fcode> has no <code>::before<\u002Fcode> slot in the actual rendered DOM — Shiny wraps pill text in a <code>&lt;span&gt;<\u002Fcode>.<\u002Ftd>\n        <td class=\"sec-ref\">§ 2<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td class=\"sym\">C<\u002Ftd>\n        <td>Quick Start renders as three inline icon-text links on one line, no tile cards.<\u002Ftd>\n        <td><code>actionLink()<\u002Fcode> emits a bare <code>&lt;a class=\"action-button shiny-bound-input\"&gt;…&lt;/a&gt;<\u002Fcode>. The <code>class = \"preset-tile\"<\u002Fcode> argument is <strong>not<\u002Fstrong> applied to the <code>&lt;a&gt;<\u002Fcode> itself — it's lost. Even when it lands, <code>a { display: inline }<\u002Fcode> from Bootstrap defeats <code>display: flex<\u002Fcode>.<\u002Ftd>\n        <td class=\"sec-ref\">§ 3<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td class=\"sym\">D<\u002Ftd>\n        <td>All 96 cells in the plate-type matrix render with a white background — no Standard / Sample / Blank / NSB / B0 distinction.<\u002Ftd>\n        <td>The CSS rules (<code>td.cell-standard<\u002Fcode> etc.) exist and are correct, but the Handsontable <code>renderer<\u002Fcode> function in <code>server_layout.R<\u002Fcode> never calls <code>Handsontable.dom.addClass(td, 'cell-standard')<\u002Fcode>. The cells are styled by inline <code>td.style.backgroundColor<\u002Fcode> which the CSS class can't override (inline beats class).<\u002Ftd>\n        <td class=\"sec-ref\">§ 4<\u002Ftd>\n      <\u002Ftr>\n      <tr>\n        <td class=\"sym\">E<\u002Ftd>\n        <td>\"Start Guided Tour\" still renders as a chunky pill with icon + label, not a quiet 12 px text link.<\u002Ftd>\n        <td><code>.btn.btn-default { … }<\u002Fcode> from Bootstrap and our token CSS overrides <code>.quiet-btn<\u002Fcode> because <code>.btn<\u002Fcode> ships first in the class list. We never wrote <code>.quiet-btn<\u002Fcode> rules with enough weight. Also: the icon is included in the button content; quiet buttons should be label-only.<\u002Ftd>\n        <td class=\"sec-ref\">§ 1<\u002Ftd>\n      <\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <p>The four-cell renderer issue (<strong>D<\u002Fstrong>) is the only fix that touches <code>server_*.R<\u002Fcode>. Everything else is markup + CSS in <code>app.R<\u002Fcode> and <code>www/style.css<\u002Fcode>.<\u002Fp>\n\n  <!-- §1 -->\n  <h2><span class=\"sec\">§ 1<\u002Fspan>Top bar — fix three-row wrap and quiet buttons<\u002Fh2>\n\n  <h3>Problem in detail<\u002Fh3>\n  <p><code>actionButton(\"start_tour\", \"Guided tour\", class = \"quiet-btn\")<\u002Fcode> produces:<\u002Fp>\n  <pre class=\"lang-html\"><code>&lt;button id=\"start_tour\"\n        type=\"button\"\n        class=\"btn btn-default action-button quiet-btn\"&gt;\n  Guided tour\n&lt;/button&gt;<\u002Fcode><\u002Fpre>\n  <p>Our CSS has <code>.quiet-btn { background: transparent; border: 0; … }<\u002Fcode> but <code>.btn-default { background: #fff !important; border: 1px solid var(--c-line) !important; }<\u002Fcode> defeats it because <code>!important<\u002Fcode> short-circuits the cascade order.<\u002Fp>\n\n  <p><code>selectInput(\"app_language\", …)<\u002Fcode> produces:<\u002Fp>\n  <pre class=\"lang-html\"><code>&lt;div class=\"form-group shiny-input-container\" style=\"width: 120px;\"&gt;\n  &lt;label class=\"control-label\" for=\"app_language\" style=\"…\"&gt;&lt;/label&gt;\n  &lt;div&gt;\n    &lt;select id=\"app_language\" class=\"shiny-bound-input\"&gt;…&lt;/select&gt;\n    &lt;script type=\"application/json\"&gt;…&lt;/script&gt;\n  &lt;/div&gt;\n&lt;/div&gt;<\u002Fcode><\u002Fpre>\n  <p>The outer <code>.shiny-input-container<\u002Fcode> is <code>display: block<\u002Fcode> and full-width inside its parent — so the flexbox row collapses.<\u002Fp>\n\n  <h3>1.1 — Replace the topbar markup in <code>app.R<\u002Fcode><\u002Fh3>\n  <p>Find this block in <code>app.R<\u002Fcode> (currently around lines 110–145):<\u002Fp>\n  <pre class=\"lang-r\"><code>  div(\n    class = \"bs-topbar\",\n    div(\n      class = \"brand\",\n      div(class = \"mono-tile\", \"B\"),\n      span(class = \"wordmark\", \"Bioassay Suite\"),\n      span(class = \"version\", \"v0.9.0\")\n    ),\n    div(\n      class = \"actions\",\n      actionButton(\"start_tour\", \"Guided tour\", class = \"quiet-btn\", icon = NULL),\n      tags$a(href = \"https://github.com/…\", target = \"_blank\",\n             rel = \"noopener noreferrer\", class = \"quiet-btn\", \"Docs\"),\n      div(class = \"divider\"),\n      selectInput(\"app_language\", NULL,\n                  choices = c(\"English\" = \"en\", \"Español\" = \"es\"),\n                  selected = \"en\",\n                  width = \"120px\")\n    )\n  ),<\u002Fcode><\u002Fpre>\n\n  <p><span class=\"label\">REPLACE VERBATIM<\u002Fspan>with:<\u002Fp>\n  <pre class=\"lang-r\"><code>  div(\n    class = \"bs-topbar\",\n    div(\n      class = \"brand\",\n      div(class = \"mono-tile\", \"B\"),\n      span(class = \"wordmark\", \"Bioassay Suite\"),\n      span(class = \"version\", \"v0.9.0\")\n    ),\n    div(\n      class = \"actions\",\n      # Hand-rolled &lt;button&gt; so we can control the class list precisely.\n      # Keeps id=\"start_tour\" and the action-button class so the existing\n      # observeEvent(input$start_tour, ...) handler still fires.\n      tags$button(\n        id = \"start_tour\",\n        type = \"button\",\n        class = \"action-button bs-quiet-btn\",\n        \"Guided tour\"\n      ),\n      tags$a(\n        href = \"https://github.com/KristofM854/Shiny-App-Competitive-Bioassays\",\n        target = \"_blank\",\n        rel = \"noopener noreferrer\",\n        class = \"bs-quiet-btn\",\n        \"Docs\"\n      ),\n      div(class = \"divider\"),\n      # Wrap selectInput in a span we can target. The .bs-lang-select\n      # class lets the CSS un-block-ify Shiny's .shiny-input-container\n      # without affecting any other selectInput in the app.\n      div(\n        class = \"bs-lang-select\",\n        selectInput(\"app_language\", NULL,\n                    choices = c(\"English\" = \"en\", \"Español\" = \"es\"),\n                    selected = \"en\",\n                    width = \"110px\")\n      )\n    )\n  ),<\u002Fcode><\u002Fpre>\n\n  <h4>Three changes worth highlighting<\u002Fh4>\n  <ol>\n    <li><code>actionButton(..., class = \"quiet-btn\")<\u002Fcode> → <code>tags$button(class = \"action-button bs-quiet-btn\", ...)<\u002Fcode>. We replace <code>actionButton<\u002Fcode> with a hand-rolled <code>&lt;button&gt;<\u002Fcode> because <code>actionButton<\u002Fcode> always stamps <code>btn btn-default<\u002Fcode> onto the class list. The <code>action-button<\u002Fcode> class is what Shiny binds the click handler to — keep it.<\u002Fli>\n    <li><code>class = \"quiet-btn\"<\u002Fcode> → <code>class = \"bs-quiet-btn\"<\u002Fcode>. Renamed to avoid colliding with any <code>.quiet-btn<\u002Fcode> rule in vendor CSS (rintrojs ships <code>.introjs-button<\u002Fcode> styles that drift into the same name space).<\u002Fli>\n    <li>The <code>selectInput<\u002Fcode> is wrapped in <code>div(class = \"bs-lang-select\")<\u002Fcode> so we can target Shiny's wrapper containers from CSS without affecting other selectInputs.<\u002Fli>\n  <\u002Fol>\n\n  <h3>1.2 — Append the topbar CSS to <code>www/style.css<\u002Fcode><\u002Fh3>\n  <p>Append the following block to <code>www/style.css<\u002Fcode> <strong>at the end of the file<\u002Fstrong> (do not edit the existing <code>.bs-topbar<\u002Fcode> rules — let these override). All selectors here are intentionally specific to <code>.bs-topbar<\u002Fcode> so they cannot leak.<\u002Fp>\n  <pre class=\"lang-css\"><code>/* ============================================\n   v3 §1 — Top bar fixes (high-specificity)\n   Defeats Bootstrap .btn-default + .form-group block layout.\n   ============================================ */\n\n/* Force the topbar row to stay on one line, regardless of what\n   Shiny inserts inside .actions. */\n.bs-topbar {\n  flex-wrap: nowrap;\n  min-height: 56px;\n  gap: 24px;\n}\n.bs-topbar .brand,\n.bs-topbar .actions {\n  flex-wrap: nowrap;\n  white-space: nowrap;\n}\n\n/* Quiet text-button (used for \"Guided tour\" + \"Docs\"). High specificity\n   beats .btn.btn-default.action-button without needing !important on\n   every property. */\n.bs-topbar .actions .bs-quiet-btn,\n.bs-topbar .actions a.bs-quiet-btn,\n.bs-topbar .actions button.bs-quiet-btn {\n  display: inline-flex;\n  align-items: center;\n  height: 28px;\n  padding: 0 10px;\n  background: transparent;\n  border: 0;\n  border-radius: var(--r-1);\n  font-family: var(--ff-sans);\n  font-size: 12px;\n  font-weight: 500;\n  color: var(--c-ink-3);\n  text-decoration: none;\n  cursor: pointer;\n  box-shadow: none;\n  transition: background 120ms, color 120ms;\n}\n.bs-topbar .actions .bs-quiet-btn:hover,\n.bs-topbar .actions a.bs-quiet-btn:hover,\n.bs-topbar .actions button.bs-quiet-btn:hover {\n  background: var(--c-surface-2);\n  color: var(--c-ink);\n  text-decoration: none;\n}\n.bs-topbar .actions .bs-quiet-btn:focus-visible {\n  outline: 2px solid var(--c-accent);\n  outline-offset: 2px;\n}\n\n/* Un-block-ify Shiny's selectInput wrapper inside the topbar.\n   .shiny-input-container is normally display:block + width:100%. */\n.bs-topbar .actions .bs-lang-select {\n  display: inline-flex;\n  align-items: center;\n}\n.bs-topbar .actions .bs-lang-select .form-group,\n.bs-topbar .actions .bs-lang-select .shiny-input-container {\n  margin: 0;\n  padding: 0;\n  width: auto !important;\n  display: inline-flex;\n  align-items: center;\n}\n.bs-topbar .actions .bs-lang-select .control-label {\n  display: none;\n}\n.bs-topbar .actions .bs-lang-select .selectize-control {\n  width: 110px !important;\n  min-width: 110px;\n  margin: 0;\n}\n.bs-topbar .actions .bs-lang-select .selectize-input {\n  height: 28px;\n  min-height: 28px;\n  padding: 4px 24px 4px 10px;\n  font-family: var(--ff-sans);\n  font-size: 12px;\n  line-height: 1.2;\n  background: var(--c-surface);\n  border: 1px solid var(--c-line);\n  border-radius: var(--r-1);\n  box-shadow: none;\n}<\u002Fcode><\u002Fpre>\n\n  <h3>1.3 — Acceptance for § 1<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>The top bar lays out as a single row at viewport widths ≥ 900 px.<\u002Fli>\n    <li>\"Guided tour\" and \"Docs\" render as 12 px quiet text buttons (no border, no fill, hover greys to <code>--c-surface-2<\u002Fcode>).<\u002Fli>\n    <li>The language select is a 110 px-wide pill on the right, vertically centered with the brand.<\u002Fli>\n    <li>Click \"Guided tour\" — <code>observeEvent(input$start_tour, …)<\u002Fcode> still fires (the rintrojs tour starts).<\u002Fli>\n  <\u002Ful>\n\n  <!-- §2 -->\n  <h2><span class=\"sec\">§ 2<\u002Fspan>Wizard stepper — restore numbers and progress connector<\u002Fh2>\n\n  <h3>Problem in detail<\u002Fh3>\n  <p><code>tabsetPanel(id = \"wizard_tabs\", type = \"pills\", ...)<\u002Fcode> emits Bootstrap 3 pill markup that Shiny re-paints whenever an inner UI fragment updates (e.g. <code>renderUI<\u002Fcode> for <code>output$step1_header<\u002Fcode>). The <code>data-step<\u002Fcode> attribute we stamp via <code>$(function(){ stamp(); })<\u002Fcode> survives the <strong>first<\u002Fstrong> paint, but on a tab-internal re-render the <code>&lt;a&gt;<\u002Fcode> elements get rebuilt and the attribute is gone.<\u002Fp>\n\n  <p>The current JS in <code>app.R<\u002Fcode>:<\u002Fp>\n  <pre class=\"lang-js\"><code>$(function() {\n  function stamp() {\n    $('.nav-pills &gt; li').each(function(i) {\n      var n = (i + 1).toString().padStart(2, '0');\n      $(this).children('a').attr('data-step', n);\n    });\n  }\n  stamp();\n  $(document).on('shown.bs.tab', stamp);\n});<\u002Fcode><\u002Fpre>\n\n  <p>This handles outer tab-switch events but <strong>not<\u002Fstrong> the inner re-renders of tab content that cause Shiny to call <code>Shiny.renderContent()<\u002Fcode> on the tab's parent. We need a more durable approach.<\u002Fp>\n\n  <h3>2.1 — Use a CSS counter-based fallback in addition to the data-step attribute<\u002Fh3>\n  <p>The most robust approach is to use <strong>both<\u002Fstrong>: the JS stamping (so <code>data-step<\u002Fcode> is present in <code>view-source<\u002Fcode>, useful for testing and for the <code>.is-done<\u002Fcode> step CSS), and a CSS counter on <code>.nav-pills &gt; li<\u002Fcode> that doesn't depend on any attribute. If JS lags or fails, the counter still paints <code>01 / 02 / 03 / 04 / 05<\u002Fcode>.<\u002Fp>\n\n  <p><strong>Append this CSS to the end of <code>www/style.css<\u002Fcode><\u002Fstrong> (after the v2 <code>.nav-pills<\u002Fcode> rules):<\u002Fp>\n  <pre class=\"lang-css\"><code>/* ============================================\n   v3 §2 — Wizard stepper resilience\n   CSS-counter fallback: numbers paint even if data-step isn't stamped.\n   Connector visible across all viewport widths.\n   ============================================ */\n\n/* Reset the nav as a counter container. */\n.nav-pills {\n  counter-reset: bs-step;\n}\n\n/* Ensure every &lt;li&gt; increments the counter. */\n.nav-pills &gt; li {\n  counter-increment: bs-step;\n}\n\n/* Numbered chip — uses CSS counter as the SOURCE OF TRUTH.\n   data-step is a layered enhancement (JS-stamped) used only by\n   .is-done state to swap the number for a checkmark. */\n.nav-pills &gt; li &gt; a::before {\n  content: counter(bs-step, decimal-leading-zero);  /* \"01\", \"02\", ... */\n  font-family: var(--ff-mono);\n  font-weight: 500;\n  font-size: 12px;\n  width: 22px;\n  height: 22px;\n  display: inline-grid;\n  place-items: center;\n  border-radius: 999px;\n  background: var(--c-surface-2);\n  color: var(--c-ink-3);\n  flex-shrink: 0;\n  margin-right: 10px;\n  transition: background 120ms, color 120ms;\n}\n\n/* Active state — strong navy chip. Selector chain matches Shiny's\n   actual emitted DOM (some Bootstrap 3 builds put .active on the &lt;li&gt;,\n   others on the &lt;a&gt;). Cover both. */\n.nav-pills &gt; li.active &gt; a::before,\n.nav-pills &gt; li &gt; a.active::before {\n  background: var(--c-accent);\n  color: #fff;\n}\n\n/* Done state — checkmark instead of number. JS adds `.is-done` to &lt;li&gt;\n   when the user advances past it. Keep this rule LAST so it wins. */\n.nav-pills &gt; li.is-done &gt; a::before {\n  content: \"✓\";\n  font-family: var(--ff-sans);\n  font-weight: 600;\n  background: var(--c-accent);\n  color: #fff;\n}\n\n/* Progress connector — short hairline between adjacent pills.\n   Fixed width so it doesn't stretch absurdly on wide screens. */\n.nav-pills &gt; li:not(:last-child) {\n  margin-right: 36px;\n}\n.nav-pills &gt; li:not(:last-child)::after {\n  content: \"\";\n  position: absolute;\n  top: 50%;\n  right: -28px;            /* sit in the gap created by margin-right */\n  width: 20px;\n  height: 1px;\n  background: var(--c-line);\n  pointer-events: none;\n}\n.nav-pills &gt; li.is-done:not(:last-child)::after {\n  background: var(--c-accent);\n}\n\n/* Make sure the pill &lt;a&gt; can host the inline-grid ::before chip\n   without breaking flex alignment. */\n.nav-pills &gt; li &gt; a {\n  display: inline-flex !important;\n  align-items: center;\n}<\u002Fcode><\u002Fpre>\n\n  <h3>2.2 — Replace the JS stamping block in <code>app.R<\u002Fcode><\u002Fh3>\n  <p>The JS still has a job: marking completed steps with <code>.is-done<\u002Fcode> and re-stamping <code>data-step<\u002Fcode> after Shiny's inner re-renders (so direct manipulation tools still see the attribute). Replace the existing <code>tags$script(HTML(...))<\u002Fcode> block with:<\u002Fp>\n\n  <pre class=\"lang-r\"><code>  tags$script(HTML(\"\n$(function() {\n  // Stamp data-step on each pill &lt;a&gt; for accessibility (screen readers\n  // can announce 'Step 02') and for testing. The CSS counter is the\n  // visual source of truth, so this script can't visually break the\n  // stepper anymore.\n  function stampSteps() {\n    $('.nav-pills &gt; li').each(function(i) {\n      var n = (i + 1).toString().padStart(2, '0');\n      $(this).children('a').attr('data-step', n);\n    });\n  }\n  stampSteps();\n\n  // Mark steps as done when the user advances past them.\n  // Listen on the document so the handler survives Shiny re-renders.\n  $(document).on('shown.bs.tab', '.nav-pills &gt; li &gt; a', function(e) {\n    stampSteps();\n    var $items = $('.nav-pills &gt; li');\n    var activeIdx = $items.index($(this).closest('li'));\n    $items.each(function(i) {\n      $(this).toggleClass('is-done', i &lt; activeIdx);\n      $(this).toggleClass('is-current', i === activeIdx);\n    });\n  });\n\n  // Re-stamp after any Shiny output finishes rendering, in case the\n  // tabset got rebuilt (defensive — the CSS counter handles the\n  // visual side regardless).\n  $(document).on('shiny:value', function() { stampSteps(); });\n});\n\")),<\u002Fcode><\u002Fpre>\n\n  <h3>2.3 — Acceptance for § 2<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>Each pill shows <code>01 / 02 / 03 / 04 / 05<\u002Fcode> as a small mono chip on the left of the label.<\u002Fli>\n    <li>The active pill's chip is solid navy; inactive pills' chips are grey on grey-soft.<\u002Fli>\n    <li>A hairline (20 px) connector sits between adjacent pills.<\u002Fli>\n    <li>After clicking \"Next\" to advance past Step 1, Step 1's chip turns into a navy checkmark.<\u002Fli>\n    <li>Open DevTools, inspect any <code>&lt;a&gt;<\u002Fcode> inside <code>.nav-pills &gt; li<\u002Fcode> — it has <code>data-step=\"0N\"<\u002Fcode> attribute.<\u002Fli>\n    <li>Shrink window to 700 px wide — pills wrap to two rows, connectors hide (existing media query handles this).<\u002Fli>\n  <\u002Ful>\n\n  <!-- §3 -->\n  <h2><span class=\"sec\">§ 3<\u002Fspan>Quick Start — three preset tiles, real cards<\u002Fh2>\n\n  <h3>Problem in detail<\u002Fh3>\n  <p><code>actionLink(\"qs_rba_stx_demo\", class = \"preset-tile\", label = tagList(div(class = \"rail\"), …))<\u002Fcode> produces, depending on shiny version:<\u002Fp>\n  <pre class=\"lang-html\"><code>&lt;a id=\"qs_rba_stx_demo\"\n   class=\"action-button shiny-bound-input\"\n   href=\"#\"&gt;\n  &lt;div class=\"rail rail-blue\"&gt;&lt;/div&gt;\n  &lt;div class=\"body\"&gt;…&lt;/div&gt;\n&lt;/a&gt;<\u002Fcode><\u002Fpre>\n  <p>Note <strong><code>class = \"preset-tile\"<\u002Fcode> is missing from the <code>&lt;a&gt;<\u002Fcode><\u002Fstrong> in older Shiny. Even when it lands, <code>&lt;a&gt;<\u002Fcode> is <code>display: inline<\u002Fcode> and the inner <code>&lt;div&gt;<\u002Fcode> blocks force a line break, breaking flex layout.<\u002Fp>\n\n  <h3>3.1 — Replace the Quick Start block in <code>app.R<\u002Fcode> with hand-rolled <code>&lt;a&gt;<\u002Fcode> tiles<\u002Fh3>\n  <p>Find the current Quick Start markup in <code>app.R<\u002Fcode> (around lines 188–260) and replace it <strong>verbatim<\u002Fstrong> with:<\u002Fp>\n\n  <pre class=\"lang-r\"><code>      # GUI refresh v3 §3 — Quick Start as three hand-rolled &lt;a&gt; tiles.\n      # Hand-rolled (not actionLink) so we control the class list and\n      # the inner DOM exactly. Keeps the action-button class + id so\n      # observeEvent(input$qs_*, ...) handlers still fire.\n      div(\n        id = \"quickstart_section\",\n        class = \"bs-card\",\n        h3(\"Quick Start\"),\n        p(class = \"bs-card-sub\",\n          \"Choose a preset to auto-configure the assay type, plate layout, \",\n          \"and standard concentrations.\"),\n\n        div(\n          class = \"bs-quickstart\",\n\n          tags$a(\n            id = \"qs_rba_stx_demo\",\n            href = \"#\",\n            class = \"action-button preset-tile\",\n            onclick = \"return false;\",\n            div(class = \"rail rail-blue\"),\n            div(\n              class = \"body\",\n              div(class = \"title\", \"RBA · Saxitoxin\"),\n              div(class = \"sub\",\n                  \"Receptor binding assay · 8 standards · triplicate\"),\n              div(class = \"meta\", \"Demo data included\")\n            )\n          ),\n\n          tags$a(\n            id = \"qs_elisa_cortisol_demo\",\n            href = \"#\",\n            class = \"action-button preset-tile\",\n            onclick = \"return false;\",\n            div(class = \"rail rail-green\"),\n            div(\n              class = \"body\",\n              div(class = \"title\", \"ELISA · Cortisol\"),\n              div(class = \"sub\",\n                  \"Competitive ELISA · 7 standards · duplicate\"),\n              div(class = \"meta\", \"Demo data included\")\n            )\n          ),\n\n          tags$a(\n            id = \"qs_elisa_custom_manual\",\n            href = \"#\",\n            class = \"action-button preset-tile\",\n            onclick = \"return false;\",\n            div(class = \"rail rail-purple\"),\n            div(\n              class = \"body\",\n              div(class = \"title\", \"ELISA · Custom\"),\n              div(class = \"sub\",\n                  \"Blank ELISA template · configure from scratch\"),\n              div(class = \"meta\", \"No demo data\")\n            )\n          )\n        ),\n\n        # Manual-configure fallbacks for STX and Cortisol stay in a\n        # quiet disclosure to avoid cluttering the primary path.\n        tags$details(\n          class = \"bs-quickstart-more\",\n          tags$summary(\"More options — configure manually without demo data\"),\n          div(\n            style = \"padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;\",\n            actionButton(\"qs_rba_stx_manual\",\n                         \"RBA Saxitoxin — manual\",\n                         class = \"btn-default\"),\n            actionButton(\"qs_elisa_cortisol_manual\",\n                         \"ELISA Cortisol — manual\",\n                         class = \"btn-default\")\n          )\n        )\n      ),<\u002Fcode><\u002Fpre>\n\n  <h4>Why hand-roll instead of actionLink<\u002Fh4>\n  <ul>\n    <li><code>tags$a(class = \"action-button preset-tile\", id = \"qs_…\")<\u002Fcode> puts both classes on the <code>&lt;a&gt;<\u002Fcode> directly. Shiny's input binding keys off <code>.action-button<\u002Fcode> + <code>id<\u002Fcode>, so <code>input$qs_rba_stx_demo<\u002Fcode> still increments on click.<\u002Fli>\n    <li><code>onclick = \"return false;\"<\u002Fcode> prevents the browser's default <code>href=\"#\"<\u002Fcode> jump-to-top, which <code>actionLink<\u002Fcode> does for free but our hand-rolled link does not.<\u002Fli>\n    <li>The DOM order (rail → body) matches what <code>.preset-tile { display: flex }<\u002Fcode> expects.<\u002Fli>\n  <\u002Ful>\n\n  <h3>3.2 — Strengthen the Quick Start CSS<\u002Fh3>\n  <p>The v2 CSS has the right intent but the selector is <code>.preset-tile<\u002Fcode> — too low-specificity to beat Bootstrap's <code>a { display: inline; color: …; text-decoration: underline }<\u002Fcode> cascade. Append this to <code>www/style.css<\u002Fcode>:<\u002Fp>\n\n  <pre class=\"lang-css\"><code>/* ============================================\n   v3 §3 — Quick Start tile fixes (high-specificity)\n   ============================================ */\n.bs-quickstart a.preset-tile,\n.bs-quickstart .preset-tile {\n  display: flex !important;\n  align-items: stretch;\n  background: var(--c-surface);\n  border: 1px solid var(--c-line);\n  border-radius: var(--r-2);\n  overflow: hidden;\n  text-align: left;\n  cursor: pointer;\n  text-decoration: none !important;\n  color: var(--c-ink) !important;\n  transition: border-color 120ms, box-shadow 120ms, transform 120ms;\n  /* Reset anchor defaults that try to leak through */\n  font-weight: inherit;\n  line-height: inherit;\n}\n.bs-quickstart a.preset-tile:hover,\n.bs-quickstart a.preset-tile:focus-visible {\n  border-color: var(--c-accent);\n  box-shadow: 0 0 0 3px var(--c-accent-soft);\n  text-decoration: none !important;\n  outline: 0;\n}\n.bs-quickstart a.preset-tile:focus-visible {\n  outline: 2px solid var(--c-accent);\n  outline-offset: 1px;\n}\n.bs-quickstart a.preset-tile:active {\n  transform: translateY(1px);\n}\n.bs-quickstart .preset-tile .rail {\n  width: 4px;\n  flex-shrink: 0;\n  align-self: stretch;\n}\n.bs-quickstart .preset-tile .rail-blue   { background: var(--c-info); }\n.bs-quickstart .preset-tile .rail-green  { background: var(--c-pass); }\n.bs-quickstart .preset-tile .rail-purple { background: #cc79a7; }\n.bs-quickstart .preset-tile .body {\n  padding: 14px 16px;\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n}\n.bs-quickstart .preset-tile .title {\n  font-size: 13px;\n  font-weight: 600;\n  color: var(--c-ink);\n}\n.bs-quickstart .preset-tile .sub {\n  font-size: 11.5px;\n  color: var(--c-ink-3);\n  line-height: 1.45;\n}\n.bs-quickstart .preset-tile .meta {\n  margin-top: 4px;\n  font-family: var(--ff-mono);\n  font-size: 10.5px;\n  color: var(--c-ink-4);\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n}\n\n/* The \"More options\" disclosure */\n.bs-quickstart-more {\n  margin-top: 14px;\n  font-size: 12px;\n}\n.bs-quickstart-more &gt; summary {\n  cursor: pointer;\n  color: var(--c-ink-3);\n  padding: 4px 0;\n  list-style: none;\n}\n.bs-quickstart-more &gt; summary::-webkit-details-marker { display: none; }\n.bs-quickstart-more &gt; summary::before {\n  content: \"▸ \";\n  display: inline-block;\n  margin-right: 4px;\n  transition: transform 120ms;\n}\n.bs-quickstart-more[open] &gt; summary::before {\n  transform: rotate(90deg);\n}\n.bs-quickstart-more &gt; summary:hover {\n  color: var(--c-ink);\n}<\u002Fcode><\u002Fpre>\n\n  <h3>3.3 — Acceptance for § 3<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>The Quick Start section shows three card-shaped tiles in a 3-column grid, each with: a coloured rail on the left (blue / green / mauve), a title, a subtitle, and an uppercase mono \"Demo data included\" / \"No demo data\" meta line.<\u002Fli>\n    <li>Tiles are equal height. Hovering one shows a navy halo (<code>box-shadow: 0 0 0 3px var(--c-accent-soft)<\u002Fcode>).<\u002Fli>\n    <li>Clicking a tile fires the matching <code>input$qs_…<\u002Fcode> observer (verify by clicking RBA · Saxitoxin and confirming the Configuration tab populates with the saxitoxin preset).<\u002Fli>\n    <li>\"More options — configure manually without demo data\" is a chevron-collapsible disclosure below the tiles. Open it: two grey buttons appear inline.<\u002Fli>\n  <\u002Ful>\n\n  <!-- §4 -->\n  <h2><span class=\"sec\">§ 4<\u002Fspan>Plate-type matrix — restore cell colours<\u002Fh2>\n\n  <h3>Problem in detail<\u002Fh3>\n  <p>The renderer that paints sample-type cells in <code>server_layout.R<\u002Fcode> writes the colour as <strong>inline <code>style.background-color<\u002Fcode><\u002Fstrong> on the <code>&lt;td&gt;<\u002Fcode>. Inline styles always beat CSS class rules. Our <code>td.cell-standard { background: rgba(0,158,115,0.10) !important; }<\u002Fcode> rules can't overpower an inline <code>style=\"background-color: white\"<\u002Fcode>.<\u002Fp>\n\n  <p>The fix is to make the renderer add a <strong>class<\u002Fstrong> (<code>cell-standard<\u002Fcode>, <code>cell-sample<\u002Fcode>, etc.) instead of writing an inline style. Then the existing CSS rules in <code>www/style.css<\u002Fcode> paint the cells correctly.<\u002Fp>\n\n  <h3>4.1 — Locate the renderer in <code>server_layout.R<\u002Fcode><\u002Fh3>\n  <p>Open <code>server_layout.R<\u002Fcode> and find the <code>output$matrix_type<\u002Fcode> block (search for <code>output$matrix_type &lt;- renderRHandsontable<\u002Fcode>). Inside, there will be a <code>hot_col(..., renderer = ...)<\u002Fcode> call or a <code>rhandsontable(...) %&gt;% hot_cols(renderer = \"function (instance, td, row, col, prop, value, cellProperties) { … }\")<\u002Fcode> call that switches on <code>value<\u002Fcode> (\"Standard\", \"Sample\", etc.) and sets <code>td.style.backgroundColor<\u002Fcode>.<\u002Fp>\n\n  <p>It looks roughly like:<\u002Fp>\n  <pre class=\"lang-r\"><code>hot_cols(renderer = \"\n  function(instance, td, row, col, prop, value, cellProperties) {\n    Handsontable.renderers.TextRenderer.apply(this, arguments);\n    if (value === 'Standard')      { td.style.backgroundColor = '#FFE0B2'; }\n    else if (value === 'Sample')   { td.style.backgroundColor = '#BBDEFB'; }\n    else if (value === 'Blank')    { td.style.backgroundColor = '#ECEFF1'; }\n    else if (value === 'NSB')      { td.style.backgroundColor = '#F8BBD0'; }\n    else if (value === 'B0')       { td.style.backgroundColor = '#FFF59D'; }\n  }\n\")<\u002Fcode><\u002Fpre>\n\n  <h3>4.2 — Replace the renderer with a class-based version<\u002Fh3>\n  <p><span class=\"label\">DROP-IN<\u002Fspan>(paste exactly — keeps the function signature identical so existing <code>hot_cols(...)<\u002Fcode> wiring keeps working):<\u002Fp>\n\n  <pre class=\"lang-r\"><code>hot_cols(renderer = \"\n  function(instance, td, row, col, prop, value, cellProperties) {\n    Handsontable.renderers.TextRenderer.apply(this, arguments);\n\n    // Strip any sample-type class from a previous render\n    td.classList.remove(\n      'cell-standard', 'cell-sample', 'cell-blank',\n      'cell-nsb', 'cell-b0', 'cell-qc', 'cell-ta', 'cell-other'\n    );\n    // Clear any legacy inline background that the v2 renderer may\n    // have written before the design system landed.\n    td.style.backgroundColor = '';\n    td.style.color = '';\n\n    // Add the class that matches the cell's sample-type value.\n    // The CSS in www/style.css paints the actual colours.\n    if (value === 'Standard')       td.classList.add('cell-standard');\n    else if (value === 'Sample')    td.classList.add('cell-sample');\n    else if (value === 'Blank')     td.classList.add('cell-blank');\n    else if (value === 'NSB')       td.classList.add('cell-nsb');\n    else if (value === 'B0')        td.classList.add('cell-b0');\n    else if (value === 'QC')        td.classList.add('cell-qc');\n    else if (value === 'TotalActivity') td.classList.add('cell-ta');\n    else if (value &amp;&amp; value.length) td.classList.add('cell-other');\n  }\n\")<\u002Fcode><\u002Fpre>\n\n  <h4>Three things to note<\u002Fh4>\n  <ul>\n    <li><code>td.classList.remove(...)<\u002Fcode> is essential. Handsontable reuses <code>&lt;td&gt;<\u002Fcode> DOM nodes across renders for performance; without explicit removal, a cell that changes from \"Standard\" to \"Sample\" would carry both classes and pick whichever rule wins specificity.<\u002Fli>\n    <li>Clearing inline <code>backgroundColor<\u002Fcode> and <code>color<\u002Fcode> is defensive — if any older renderer code wrote inline styles on the cells, we wipe them so the class rules can paint.<\u002Fli>\n    <li>Keep the <code>Handsontable.renderers.TextRenderer.apply(this, arguments)<\u002Fcode> line first — it's what writes the value into the cell.<\u002Fli>\n  <\u002Ful>\n\n  <h3>4.3 — No CSS change needed for § 4<\u002Fh3>\n  <p>The class rules already exist in <code>www/style.css<\u002Fcode>:<\u002Fp>\n  <pre class=\"lang-css\"><code>.handsontable td.cell-standard { background: rgba(0,158,115,0.10) !important; color: #006d51 !important; }\n.handsontable td.cell-sample   { background: rgba(0,114,178,0.10) !important; color: #00497a !important; }\n.handsontable td.cell-blank    { background: var(--c-surface-2) !important; color: var(--c-ink-3) !important; }\n.handsontable td.cell-nsb      { background: rgba(204,121,167,0.12) !important; color: #8a4a6e !important; }\n.handsontable td.cell-b0       { background: rgba(230,159,0,0.12) !important; color: #8a5e00 !important; }<\u002Fcode><\u002Fpre>\n  <p>These will now win because we removed the inline <code>style.backgroundColor<\u002Fcode> that was beating them.<\u002Fp>\n\n  <h3>4.4 — Acceptance for § 4<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>Open the Plate Layout tab (Tab 2). The Sample Type matrix shows tinted cells: a softer green for Standards, soft blue for Samples, neutral grey for Blanks, mauve for NSB, amber for B0.<\u002Fli>\n    <li>The legend chips below the matrix (<code>&lt;div class=\"bs-legend\"&gt;<\u002Fcode>) match the cell tints visually.<\u002Fli>\n    <li>Click a cell, change \"Standard\" → \"Sample\" via the dropdown — the tint switches from green to blue without page reload.<\u002Fli>\n    <li>Inspect a Standard cell in DevTools: it has <code>class=\"… cell-standard\"<\u002Fcode> and <strong>no<\u002Fstrong> inline <code>style=\"background-color: …\"<\u002Fcode>.<\u002Fli>\n  <\u002Ful>\n\n  <!-- §5 -->\n  <h2><span class=\"sec\">§ 5<\u002Fspan>Apply order<\u002Fh2>\n  <p>Apply the four sections in <strong>this order<\u002Fstrong> — each builds on the prior:<\u002Fp>\n  <ol>\n    <li><strong>§ 4 first<\u002Fstrong> (renderer fix). It's the only server-side change. Verify cells colour up before touching anything else.<\u002Fli>\n    <li><strong>§ 1<\u002Fstrong> (topbar markup + CSS). Verify single-row layout at 1200 px wide.<\u002Fli>\n    <li><strong>§ 2<\u002Fstrong> (stepper CSS counter + JS). Verify numbers + connector + done-state checkmark.<\u002Fli>\n    <li><strong>§ 3 last<\u002Fstrong> (Quick Start tiles). Verify three cards, working clicks.<\u002Fli>\n  <\u002Fol>\n  <p>Run a full happy path after each step (RBA Saxitoxin → Quick Start → Plate Layout → Upload → Analysis → Generate Report). Catch any regression before stacking the next change.<\u002Fp>\n\n  <!-- §6 -->\n  <h2><span class=\"sec\">§ 6<\u002Fspan>Acceptance checklist (full v3)<\u002Fh2>\n  <p>Run this checklist visually + functionally before merging. Each item maps to a screenshot Kristof can take and compare to the mockup HTML.<\u002Fp>\n\n  <h3>Topbar<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>Single row, 56 px tall, brand on left + actions on right.<\u002Fli>\n    <li>\"Guided tour\" and \"Docs\" are 12 px quiet text buttons (no border/fill in resting state).<\u002Fli>\n    <li>Hover on either greys the background to <code>--c-surface-2<\u002Fcode>.<\u002Fli>\n    <li>Language select is 110 px wide, on the far right, vertically centered.<\u002Fli>\n    <li>Click \"Guided tour\" — rintrojs tour starts.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Stepper<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>Five pills with <code>01 / 02 / 03 / 04 / 05<\u002Fcode> mono chips.<\u002Fli>\n    <li>Active pill has a solid navy chip; inactive pills have grey-on-grey-soft chips.<\u002Fli>\n    <li>20 px hairline connector between adjacent pills.<\u002Fli>\n    <li>Advancing to step 2 turns step 1's chip into a navy checkmark (<code>✓<\u002Fcode>).<\u002Fli>\n    <li>At &lt; 700 px wide, pills wrap to 2 rows; connectors hide.<\u002Fli>\n    <li>Inspect any pill <code>&lt;a&gt;<\u002Fcode>: it has <code>data-step=\"0N\"<\u002Fcode> attribute.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Quick Start<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>Three cards in a 3-column grid (collapses to 1 column &lt; 1100 px).<\u002Fli>\n    <li>Each card: coloured 4 px rail (blue / green / mauve), title, subtitle, mono uppercase meta.<\u002Fli>\n    <li>Hovering a card shows the navy halo.<\u002Fli>\n    <li>Clicking RBA · Saxitoxin loads the saxitoxin preset and navigates to Tab 3 (existing handler logic).<\u002Fli>\n    <li>\"More options — configure manually without demo data\" disclosure expands to show two grey buttons.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Plate matrix<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>Sample Type matrix shows tinted cells (no white-on-white).<\u002Fli>\n    <li>Standard = soft green, Sample = soft blue, Blank = neutral grey, NSB = mauve, B0 = amber.<\u002Fli>\n    <li>Cell text colour shifts to a darker variant of the cell tint (legible on tint).<\u002Fli>\n    <li>Legend chips below the matrix match the cell colours.<\u002Fli>\n    <li>Changing a cell's value via the dropdown updates the tint live.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Regression (no business-logic damage)<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>RBA Saxitoxin example end-to-end produces the same numbers as before (run the golden-numbers test from <code>IMPLEMENTATION_PLAN.md<\u002Fcode> B6).<\u002Fli>\n    <li>ELISA Cortisol example end-to-end produces the same control summary.<\u002Fli>\n    <li>Multi-wavelength test still produces per-wavelength CSVs and the Bland-Altman section.<\u002Fli>\n    <li>Auto-save still restores layout on relaunch.<\u002Fli>\n    <li>Language toggle still flips all UI strings to Spanish.<\u002Fli>\n  <\u002Ful>\n\n  <h3>Colorblind-safety<\u002Fh3>\n  <ul class=\"check-list\">\n    <li>Run a CVD simulator (e.g. Sim Daltonism) — Standard / Sample / NSB / B0 cells remain distinguishable in deuteranopia and protanopia modes (Okabe-Ito hues are CB-safe by construction; this is a visual sanity check).<\u002Fli>\n  <\u002Ful>\n\n  <!-- §7 -->\n  <h2><span class=\"sec\">§ 7<\u002Fspan>What's explicitly out of scope for v3<\u002Fh2>\n  <ul>\n    <li>No further Rmd report-token CSS changes.<\u002Fli>\n    <li>No new tabs, sub-tabs, or step reordering.<\u002Fli>\n    <li>No changes to the Plate Layout layer-switcher UX (it's working; just confirm the active layer's <code>data-step<\u002Fcode> chip in the rail still highlights).<\u002Fli>\n    <li>No changes to the heatmap palette (already swapped to Okabe-Ito in v2).<\u002Fli>\n    <li>No changes to the pre-flight panel logic.<\u002Fli>\n    <li>No changes to the report KPI strip layout (already in v2).<\u002Fli>\n  <\u002Ful>\n  <p>If Kristof flags any of these as still wrong after v3 lands, capture screenshots and we'll do v4. Don't hand-roll fixes for them mid-v3.<\u002Fp>\n\n  <hr>\n  <div class=\"meta-footer\">Last updated: 2026-05-04. Apply on top of <code>main<\u002Fcode> at commit d389999. v3 supersedes v2 only for the four sections above; v2 remains the spec for everything else.<\u002Fdiv>\n\n<\u002Fmain>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
