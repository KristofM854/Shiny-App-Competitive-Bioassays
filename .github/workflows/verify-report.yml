name: Verify reports

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ~/R/library

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/R/library
          key: r-${{ runner.os }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-${{ runner.os }}-

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::car
            any::digest
            any::dplyr
            any::drc
            any::DT
            any::ggplot2
            any::ggrepel
            any::ggtext
            any::ggthemes
            any::glue
            any::htmltools
            any::htmlwidgets
            any::jsonlite
            any::kableExtra
            any::knitr
            any::patchwork
            any::plotly
            any::purrr
            any::readr
            any::readxl
            any::remotes
            any::rhandsontable
            any::rintrojs
            any::rmarkdown
            any::scales
            any::shiny
            any::shinyFeedback
            any::shinycssloaders
            any::shinyjs
            any::stringr
            any::tibble
            any::tidyr
            any::withr

      - name: Render example reports
        run: Rscript scripts/render_examples.R --out check-renders
        shell: bash

      - name: Verify reports
        run: Rscript scripts/verify_report.R check-renders/rba_full.html check-renders/rba_compact.html check-renders/elisa_full.html check-renders/elisa_compact.html
        shell: bash

      - name: Upload renders and audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-renders-${{ github.sha }}
          path: |
            check-renders/*.html
            audit/verify_report_*.txt
          retention-days: 30
