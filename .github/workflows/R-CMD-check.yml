name: R-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  render-verify:
    runs-on: ubuntu-latest
    name: Render examples & verify HTML

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::car
            any::digest
            any::dplyr
            any::drc
            any::DT
            any::ggplot2
            any::ggrepel
            any::ggtext
            any::ggthemes
            any::glue
            any::htmltools
            any::htmlwidgets
            any::jsonlite
            any::kableExtra
            any::knitr
            any::patchwork
            any::plotly
            any::purrr
            any::readr
            any::readxl
            any::remotes
            any::rhandsontable
            any::rintrojs
            any::rmarkdown
            any::scales
            any::shiny
            any::shinyFeedback
            any::shinycssloaders
            any::shinyjs
            any::stringr
            any::tibble
            any::tidyr
            any::withr

      - name: Render example reports
        run: Rscript scripts/render_examples.R --out /tmp/rendered
        shell: bash

      - name: Run verify_report.sh
        run: |
          bash scripts/verify_report.sh \
            /tmp/rendered/rba_full.html \
            /tmp/rendered/rba_compact.html \
            /tmp/rendered/elisa_full.html \
            /tmp/rendered/elisa_compact.html
        shell: bash

      - name: Print file sizes
        run: wc -c /tmp/rendered/*.html
        shell: bash

      - name: Upload rendered HTMLs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-reports
          path: /tmp/rendered/*.html
          retention-days: 14

  R-tests:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: '4.4'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::shinytest2
            any::chromote
          extra-packages: |
            any::car
            any::digest
            any::dplyr
            any::drc
            any::DT
            any::ggplot2
            any::ggrepel
            any::ggtext
            any::ggthemes
            any::glue
            any::htmltools
            any::htmlwidgets
            any::jsonlite
            any::kableExtra
            any::knitr
            any::patchwork
            any::plotly
            any::purrr
            any::readr
            any::readxl
            any::remotes
            any::rhandsontable
            any::rintrojs
            any::rmarkdown
            any::scales
            any::shiny
            any::shinyFeedback
            any::shinycssloaders
            any::shinyjs
            any::stringr
            any::tibble
            any::tidyr
            any::withr

      # Chrome is required only by shinytest2 tests (which use chromote).
      # On the windows-latest runner (currently Windows Server 2025 / build
      # 26100), `browser-actions/setup-chrome@v1` terminates the runner
      # silently mid-job — no log lines, no exit code, post-cleanup fires
      # immediately and the remaining workflow steps never start. The
      # shinytest2 tests skip themselves when chromote can't find a browser,
      # so on Windows we let them skip rather than install Chrome.
      - name: Install Chrome
        if: runner.os != 'Windows'
        uses: browser-actions/setup-chrome@v1

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
        shell: bash

      - name: R CMD check
        run: |
          R CMD build . --no-build-vignettes
          R CMD check --no-manual --no-vignettes --no-build-vignettes *.tar.gz
        shell: bash
