name: R-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-tests:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: '4.2'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::shinytest2
            any::chromote
            any::covr
          extra-packages: |
            any::car
            any::digest
            any::dplyr
            any::drc
            any::ggplot2
            any::ggrepel
            any::ggtext
            any::ggthemes
            any::glue
            any::htmltools
            any::htmlwidgets
            any::jsonlite
            any::kableExtra
            any::knitr
            any::patchwork
            any::plotly
            any::purrr
            any::readr
            any::readxl
            any::remotes
            any::rhandsontable
            any::rintrojs
            any::rmarkdown
            any::scales
            any::shiny
            any::shinyFeedback
            any::shinycssloaders
            any::shinyjs
            any::stringr
            any::tibble
            any::tidyr
            any::withr

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: R CMD check
        run: |
          R CMD build . --no-build-vignettes
          R CMD check --no-manual --no-vignettes --no-build-vignettes *.tar.gz
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: Rscript -e 'covr::codecov(quiet = FALSE)'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
