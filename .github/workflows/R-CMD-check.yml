name: R-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::shinytest2
            any::chromote
          extra-packages: |
            any::car
            any::digest
            any::dplyr
            any::drc
            any::ggplot2
            any::ggrepel
            any::ggtext
            any::ggthemes
            any::glue
            any::htmltools
            any::htmlwidgets
            any::jsonlite
            any::kableExtra
            any::knitr
            any::patchwork
            any::plotly
            any::purrr
            any::readr
            any::readxl
            any::rhandsontable
            any::rintrojs
            any::rmarkdown
            any::scales
            any::shiny
            any::shinyFeedback
            any::shinycssloaders
            any::shinyjs
            any::stringr
            any::tibble
            any::tidyr
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
